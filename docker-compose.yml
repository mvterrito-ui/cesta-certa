# Banco PostgreSQL local para desenvolvimento (em produção usamos o Supabase).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cesta
      POSTGRES_PASSWORD: cesta
      POSTGRES_DB: cesta_certa
    ports:
      - "5432:5432"
    volumes:
      - dados:/var/lib/postgresql/data

volumes:
  dados:
