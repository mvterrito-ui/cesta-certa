name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API (Python 3.13 + PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cesta
          POSTGRES_PASSWORD: cesta
          POSTGRES_DB: cesta_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cesta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cesta:cesta@localhost:5432/cesta_teste
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Lint e formatação (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Testes unitários
        run: pytest tests/unit -v
      - name: Testes de integração (API + PostgreSQL)
        run: pytest tests/integration -v --cov=app --cov-report=term-missing
      - name: Auditoria de dependências (pip-audit)
        continue-on-error: true
        run: pip install pip-audit && pip-audit -r requirements.txt

  frontend:
    name: Web (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Formatação (prettier)
        run: npm run format:check
      - name: Testes unitários (Vitest)
        run: npm run test:ci
      - name: Build de produção
        run: npm run build
      - name: Auditoria de dependências (npm audit)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
