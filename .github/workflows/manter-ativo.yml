# Verificação diária da API e do banco: consulta /saude/banco, que executa "SELECT 1".
# O UptimeRobot (a cada 5 min) usa /saude, que não toca no banco, para o Neon
# poder suspender o compute quando ocioso e não esgotar o plano gratuito.
name: Manter API ativa

on:
  schedule:
    - cron: "0 11 * * *" # todo dia às 8h de Brasília
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_URL != '' }}
    steps:
      - name: Consultar /saude/banco
        run: curl --fail --retry 3 --retry-delay 20 --max-time 60 "${{ vars.API_URL }}/saude/banco"
